<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPSC Exam Pro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
    <div>BPSC Exam Platform</div>
    <div id="status">Q1/5</div>
    <div id="timerText">⏳ 20</div>
</div>

<div class="progress">
    <div class="progress-bar" id="bar"></div>
</div>

<div class="timer-bar" id="timerBar"></div>

<div class="app">

<!-- MAIN -->
<div class="main">

<div class="box" id="quizBox">

    <div id="qText"></div>
    <div id="options"></div>

    <div class="btns">
        <button onclick="prev()">Previous</button>
        <button onclick="mark()">Mark</button>
        <button onclick="next()">Next</button>
        <button onclick="submitQuiz()">Submit</button>
    </div>

</div>

<!-- RESULT -->
<div class="result" id="resultBox">
    <h2>Result Dashboard</h2>
    <div id="scoreText"></div>
    <div id="accuracy"></div>

    <h3>Review</h3>
    <div id="review"></div>

    <button onclick="retestWrong()">Retest Wrong Questions</button>
</div>

</div>

<!-- SIDEBAR -->
<div class="sidebar">
    <h3>Palette</h3>
    <div class="palette" id="palette"></div>
</div>

</div>

<script src="script.js"></script>
</body>
</html>

<button onclick="retestWrong()" class="retest">
🔥 Retest Wrong Questions
</button>

<button onclick="loadTopic('history')">History</button>
<button onclick="loadTopic('geography')">Geography</button>
<button onclick="loadTopic('polity')">Polity</button>
<button onclick="loadTopic('history2')">History-2</button>
<button onclick="loadTopic('current')">Current Affairs</button>
